spring:
  config:
    import:
      - optional:file:.env[.properties]
  application:
    name: NBE12-14-1-TEAM03
  datasource:
    url: jdbc:h2:~/team03db
    driver-class-name: org.h2.Driver
    username: ${DB_USER}
    password: ${DB_PWD}

  h2:
    console:
      enabled: true
      path: /h2-console